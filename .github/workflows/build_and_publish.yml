name: Build

on:
  push:
    branches:
      - main
    tags:
      - '*'
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - 'release.ps1'
      - 'Tests/**'
      - '.codex/**'
      - '.codex_*'
      - '.vscode/**'
      - '.idea/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: BigWigsMods/packager@v2
        with:
          args: -l -p 1801008
        env:
          CF_API_TOKEN: ${{ secrets.CURSEFORGE_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: Event-Notifier
          path: .release/*.zip
          if-no-files-found: error
